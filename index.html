<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mapas de PUBG BATTLEGROUNDS con ubicaciones de salas, llaves y puntos especiales." />
    <title>Mapas PUBG BATTLEGROUNDS</title>
    <link rel="preload" href="Tiza.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <header class="site-header">
      <div class="brand">
        <p class="eyebrow">PUBG BATTLEGROUNDS</p>
        <h1>Mapas de ubicaciones</h1>
        <p class="subtitle">Guias visuales para llaves, salas secretas y puntos especiales por mapa.</p>
      </div>
      <button class="tiza-button" type="button" id="openTiza">Tiza</button>
    </header>

    <main>
      <section class="toolbar" aria-label="Controles de mapas">
        <label class="search-wrap" for="searchInput">
          <span>Buscar</span>
          <input id="searchInput" type="search" placeholder="Nombre o tipo de ubicacion" autocomplete="off" />
        </label>
        <div class="filter-group" aria-label="Filtrar mapas">
          <button class="filter-btn is-active" type="button" data-filter="all">Todos</button>
          <button class="filter-btn" type="button" data-filter="secret">Secret rooms</button>
          <button class="filter-btn" type="button" data-filter="keys">Llaves</button>
          <button class="filter-btn" type="button" data-filter="special">Especiales</button>
        </div>
      </section>

      <section class="map-grid" id="mapGrid" aria-label="Lista de mapas"></section>

      <section class="team-roulette" aria-labelledby="rouletteTitle">
        <div class="roulette-header">
          <div>
            <p class="eyebrow">Sala personalizada</p>
            <h2 id="rouletteTitle">Ruleta de equipos</h2>
            <p class="roulette-copy">Pega los nombres, elige cuantos equipos usaran y sortea la partida al azar.</p>
          </div>
          <div class="team-control">
            <label for="teamCount">Equipos</label>
            <input id="teamCount" type="number" min="1" max="7" value="7" />
          </div>
        </div>

        <div class="roulette-layout">
          <div class="players-panel">
            <label for="playerNames">Jugadores</label>
            <textarea id="playerNames" spellcheck="false">AMIL-LAF
1de2
Frantirador9
Ranyet
MrCntral
dio1305
Onixxx
Tom-_-Draag
TIZA_HP</textarea>
            <div class="roulette-actions">
              <button class="spin-button" type="button" id="spinTeams">Sortear equipos</button>
              <button class="ghost-button" type="button" id="resetTeams">Restaurar nombres</button>
            </div>
          </div>

          <div class="teams-board" id="teamsBoard" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <dialog class="viewer" id="viewer">
      <div class="viewer-top">
        <div>
          <p class="viewer-kicker" id="viewerType"></p>
          <h2 id="viewerTitle"></h2>
        </div>
        <button class="icon-btn" type="button" id="closeViewer" aria-label="Cerrar visor">Cerrar</button>
      </div>
      <div class="viewer-frame">
        <button class="nav-btn previous" type="button" id="previousMap" aria-label="Mapa anterior">Anterior</button>
        <img id="viewerImage" alt="" />
        <button class="nav-btn next" type="button" id="nextMap" aria-label="Mapa siguiente">Siguiente</button>
      </div>
      <div class="viewer-bottom">
        <p id="viewerDescription"></p>
        <a id="openImage" href="#" target="_blank" rel="noopener">Abrir imagen completa</a>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
